<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apfelfall im Sonnensystem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: zwei gleich große Fallrohre nebeneinander, darüber je eine Planetenauswahl, darunter die Knöpfe. Comic-Look wie die übrigen Seiten "Physik Klasse 7". */
:root{
  --paper:#fff4cf;
  --paper-dot:#f3dc93;
  --ink:#1b1b1f;
  --panel:#ffffff;
  --blue:#1f6fd1;
  --yellow:#ffd23f;
  --green:#2e9e5b;
  --muted:#5b5646;
  --font-display:"Bangers","Impact","Arial Black",sans-serif;
  --font-body:"Comic Neue","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{
  margin:0;color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  background-color:var(--paper);
  background-image:radial-gradient(var(--paper-dot) 1.6px,transparent 1.8px);
  background-size:14px 14px;
  padding-inline:16px;padding-block:18px 40px;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.back{display:inline-block;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--ink);margin-bottom:6px}
.back:hover{color:var(--blue);border-color:var(--blue)}
h1{font-family:var(--font-display);font-weight:400;letter-spacing:1.5px;font-size:clamp(32px,5.5vw,52px);line-height:.95;margin:0;
  color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.5vw,24px)}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick label{font-family:var(--font-display);font-size:22px;letter-spacing:1px}
select{font-family:var(--font-body);font-weight:700;font-size:18px;border:3px solid var(--ink);border-radius:8px;padding:4px 8px;
  background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:0;max-width:100%}
select:disabled{opacity:.55;cursor:not-allowed}
.panel{background:var(--panel);border:5px solid var(--ink);box-shadow:7px 7px 0 var(--ink);min-width:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:460/600}

.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center;margin-top:6px}
.btn{font-family:var(--font-display);font-size:24px;letter-spacing:1px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);
  padding:6px 18px 3px;border-radius:8px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:transform .1s, box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.go{background:var(--green);color:#fff;font-size:32px;padding:8px 28px 4px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.slow{display:inline-flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.slow input{width:20px;height:20px;accent-color:var(--blue)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="index.html">← Physik Klasse 7</a>
    <h1>Apfelfall im Sonnensystem</h1>
  </header>

  <div class="duo">
    <div class="side">
      <div class="pick"><label for="selL">Links:</label><select id="selL"></select></div>
      <div class="panel"><canvas id="cL" width="460" height="600" role="img" aria-label="Apfel fällt auf dem linken Himmelskörper"></canvas></div>
    </div>
    <div class="side">
      <div class="pick"><label for="selR">Rechts:</label><select id="selR"></select></div>
      <div class="panel"><canvas id="cR" width="460" height="600" role="img" aria-label="Apfel fällt auf dem rechten Himmelskörper"></canvas></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn go" id="go">Fall starten</button>
    <button class="btn" id="reset">Zurücksetzen</button>
    <label class="slow"><input type="checkbox" id="slow"> Zeitlupe</label>
  </div>
</div>

<script>
(function(){
"use strict";
const INK="#1b1b1f";
const W=460,H=600;
const TOP_Y=120;          // Apfel-Mittelpunkt am Start
const GROUND_Y=500;       // Oberfläche
const R_APPLE=22;
const HEIGHT_M=5;         // Fallhöhe in m
const PPM=(GROUND_Y-R_APPLE-TOP_Y)/HEIGHT_M;

/* Ortsfaktoren (Oberfläche, bei Gasplaneten Wolkenobergrenze) in N/kg */
const BODIES=[
  {id:"merkur", name:"Merkur",  g:3.7,  sky:"#15161f", stars:true, ground:"#8c7b6b", type:"rock"},
  {id:"venus",  name:"Venus",   g:8.9,  sky:"#e8c26a", ground:"#c98a3a", type:"rock"},
  {id:"erde",   name:"Erde",    g:9.8,  sky:"#9fd3ff", ground:"#5cb85c", type:"grass"},
  {id:"mond",   name:"Mond",    g:1.6,  sky:"#101425", stars:true, ground:"#b9b9b9", type:"crater"},
  {id:"mars",   name:"Mars",    g:3.7,  sky:"#e8a77a", ground:"#c1440e", type:"rock"},
  {id:"jupiter",name:"Jupiter", g:24.8, sky:"#e3c79f", ground:"#c99b6d", band:"#efdcc0", type:"gas"},
  {id:"saturn", name:"Saturn",  g:10.4, sky:"#efe2b5", ground:"#d9b96b", band:"#f3e3b0", type:"gas"},
  {id:"uranus", name:"Uranus",  g:8.9,  sky:"#bdeef2", ground:"#7fd1d9", band:"#a9e4ea", type:"gas"},
  {id:"neptun", name:"Neptun",  g:11.2, sky:"#5d7fe6", ground:"#2a46b0", band:"#4766d0", type:"gas"},
  {id:"pluto",  name:"Pluto",   g:0.6,  sky:"#0d0f1a", stars:true, ground:"#e3d2bf", type:"crater"}
];
const byId=id=>BODIES.find(b=>b.id===id);
const gTxt=g=>g.toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});

function makeSide(selId,canvasId,def){
  const sel=document.getElementById(selId);
  sel.innerHTML=BODIES.map(b=>`<option value="${b.id}">${b.name} (g = ${gTxt(b.g)} N/kg)</option>`).join("");
  sel.value=def;
  const c=document.getElementById(canvasId);
  const side={sel,c,ctx:c.getContext("2d"),body:byId(def),t:0,y:TOP_Y,landed:false,landTime:0,rank:0,stars:[]};
  side.stars=Array.from({length:40},(_,i)=>[(i*97.3)%W,(i*53.7)%(GROUND_Y-40),1+(i%3)*0.6]);
  sel.addEventListener("change",()=>{side.body=byId(sel.value);resetAll();});
  return side;
}
const L=makeSide("selL","cL","erde");
const R=makeSide("selR","cR","mond");
const SIDES=[L,R];

let running=false,startT=0,landCount=0;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  SIDES.forEach(s=>{s.c.width=Math.round(W*dpr);s.c.height=Math.round(H*dpr);s.ctx.setTransform(dpr,0,0,dpr,0,0);});
  SIDES.forEach(draw);
}
window.addEventListener("resize",resize);

function resetAll(){
  running=false;landCount=0;
  SIDES.forEach(s=>{s.t=0;s.y=TOP_Y;s.landed=false;s.rank=0;});
  SIDES.forEach(draw);ui();
}
function ui(){
  document.getElementById("go").disabled=running;
  L.sel.disabled=R.sel.disabled=running;
}

/* ---------- Zeichnen ---------- */
function comic(ctx,t,x,y,size,fill,rot,align){ctx.save();ctx.translate(x,y);ctx.rotate((rot||0)*Math.PI/180);
  ctx.font=`${size}px Bangers, Impact, sans-serif`;ctx.textAlign=align||"center";ctx.textBaseline="middle";
  ctx.lineWidth=Math.max(3,size/8);ctx.lineJoin="round";ctx.strokeStyle=INK;ctx.strokeText(t,0,0);ctx.fillStyle=fill;ctx.fillText(t,0,0);ctx.restore();}
function apple(ctx,x,y,squash){
  ctx.save();ctx.translate(x,y);ctx.scale(1+squash*0.18,1-squash*0.18);
  ctx.strokeStyle="#6b3a1e";ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(0,-R_APPLE+4);ctx.quadraticCurveTo(-2,-R_APPLE-6,4,-R_APPLE-12);ctx.stroke();
  ctx.fillStyle="#5cb85c";ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(3,-R_APPLE-6);ctx.quadraticCurveTo(18,-R_APPLE-18,26,-R_APPLE-8);ctx.quadraticCurveTo(14,-R_APPLE+2,3,-R_APPLE-6);ctx.fill();ctx.stroke();
  ctx.fillStyle="#e63b2e";ctx.lineWidth=4;ctx.beginPath();
  ctx.moveTo(0,-R_APPLE+6);ctx.bezierCurveTo(-14,-R_APPLE-4,-R_APPLE-6,-6,-R_APPLE+1,8);ctx.bezierCurveTo(-R_APPLE+6,R_APPLE+2,-8,R_APPLE+2,0,R_APPLE-3);
  ctx.bezierCurveTo(8,R_APPLE+2,R_APPLE-6,R_APPLE+2,R_APPLE-1,8);ctx.bezierCurveTo(R_APPLE+6,-6,14,-R_APPLE-4,0,-R_APPLE+6);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=4;ctx.beginPath();ctx.arc(-6,-2,11,Math.PI*1.05,Math.PI*1.45);ctx.stroke();
  ctx.restore();
}
function draw(s){
  const ctx=s.ctx,b=s.body;
  ctx.clearRect(0,0,W,H);
  // Himmel
  ctx.fillStyle=b.sky;ctx.fillRect(0,0,W,H);
  if(b.stars){ctx.fillStyle="#fff";s.stars.forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();});}
  else{ctx.fillStyle="rgba(27,27,31,.06)";for(let y=6;y<GROUND_Y;y+=12)for(let x=6;x<W;x+=12){ctx.beginPath();ctx.arc(x,y,1.4,0,7);ctx.fill();}}
  // Boden
  ctx.fillStyle=b.ground;ctx.fillRect(-5,GROUND_Y,W+10,H-GROUND_Y+5);
  if(b.type==="grass"){ctx.fillStyle="#7a4a24";ctx.fillRect(-5,GROUND_Y+22,W+10,H);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,GROUND_Y+22);ctx.lineTo(W,GROUND_Y+22);ctx.stroke();}
  if(b.type==="crater"){ctx.strokeStyle="rgba(27,27,31,.45)";ctx.lineWidth=3;[[80,GROUND_Y+30,30],[300,GROUND_Y+55,40],[400,GROUND_Y+22,18]].forEach(([x,y,r])=>{ctx.beginPath();ctx.ellipse(x,y,r,r*0.35,0,0,7);ctx.stroke();});}
  if(b.type==="rock"){ctx.fillStyle="rgba(27,27,31,.25)";[[60,GROUND_Y+40,10],[250,GROUND_Y+70,14],[390,GROUND_Y+30,8]].forEach(([x,y,r])=>{ctx.beginPath();ctx.ellipse(x,y,r*1.4,r,0,0,7);ctx.fill();});}
  if(b.type==="gas"){ctx.fillStyle=b.band;[GROUND_Y+18,GROUND_Y+52,GROUND_Y+82].forEach(y=>{ctx.beginPath();ctx.moveTo(-5,y);for(let x=0;x<=W+10;x+=40)ctx.quadraticCurveTo(x+20,y-8,x+40,y);ctx.lineTo(W+10,y+14);ctx.lineTo(-5,y+14);ctx.closePath();ctx.fill();});}
  ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(W,GROUND_Y);ctx.stroke();

  // Halterung
  ctx.fillStyle="#9aa1a8";ctx.strokeStyle=INK;ctx.lineWidth=3.5;
  ctx.fillRect(30,40,12,GROUND_Y-40);ctx.strokeRect(30,40,12,GROUND_Y-40);
  ctx.fillRect(30,40,W/2-30+10,12);ctx.strokeRect(30,40,W/2-30+10,12);
  ctx.fillRect(W/2-8,52,16,TOP_Y-R_APPLE-14-52);ctx.strokeRect(W/2-8,52,16,TOP_Y-R_APPLE-14-52);
  // Höhenangabe
  const mk=b.stars?"#ffffff":INK;
  ctx.setLineDash([7,6]);ctx.strokeStyle=mk;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(W-56,TOP_Y);ctx.lineTo(W-56,GROUND_Y);ctx.stroke();ctx.setLineDash([]);
  [TOP_Y,GROUND_Y].forEach(y=>{ctx.beginPath();ctx.moveTo(W-68,y);ctx.lineTo(W-44,y);ctx.stroke();});
  comic(ctx,"5 m",W-56,(TOP_Y+GROUND_Y)/2,26,"#fff",0);

  // Apfel
  const squash=s.landed?Math.max(0,1-(performance.now()-s.landTime)/250):0;
  apple(ctx,W/2,s.y,squash);
  if(s.landed){
    comic(ctx,"PLOPP!",W/2+70,GROUND_Y-60,30,"#ffd23f",-8);
    if(s.rank===1)comic(ctx,"Zuerst unten!",W/2,GROUND_Y-120,30,"#fff",-4);
  }

  // Name und g
  comic(ctx,b.name.toUpperCase(),W/2,GROUND_Y+34,40,"#fff",0);
  comic(ctx,"g = "+gTxt(b.g)+" N/kg",W/2,GROUND_Y+74,32,"#ffd23f",0);
}

/* ---------- Fall ---------- */
document.getElementById("go").onclick=()=>{
  if(SIDES.some(s=>s.landed))resetAll();
  running=true;startT=performance.now();landCount=0;ui();
};
document.getElementById("reset").onclick=resetAll;

function loop(now){
  if(running){
    const speed=document.getElementById("slow").checked?0.25:1;
    const dt=Math.min(0.05,(now-(loop.last||now))/1000)*speed;
    SIDES.forEach(s=>{
      if(s.landed)return;
      s.t+=dt;
      const yy=TOP_Y+0.5*s.body.g*s.t*s.t*PPM;
      if(yy>=GROUND_Y-R_APPLE){
        s.y=GROUND_Y-R_APPLE;s.landed=true;s.landTime=now;landCount++;
        // gleichzeitige Landung (gleiches g) -> beide ohne "Zuerst"
        s.rank=landCount;
      }else s.y=yy;
    });
    if(L.landed&&R.landed){
      running=false;
      if(Math.abs(L.t-R.t)<1e-3||L.body.g===R.body.g){L.rank=R.rank=0;}
      ui();
    }
  }
  loop.last=now;
  SIDES.forEach(draw);
  requestAnimationFrame(loop);
}
resize();ui();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>SIDES.forEach(draw));
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
