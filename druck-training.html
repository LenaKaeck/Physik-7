<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Druck-Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: Kopfzeile mit Münzstand, Level-Leiste (15 Felder), darunter die Aufgabenkarte mit Tipps, Rückmeldung und Lösungsweg. */
:root{
  --paper:#fff4cf;--paper-dot:#f3dc93;--ink:#1b1b1f;--panel:#fff;
  --red:#e63b2e;--blue:#1f6fd1;--yellow:#ffd23f;--green:#2e9e5b;--orange:#e8820c;--purple:#7a3fc4;--muted:#5b5646;
  --c-F:#fbd3cf;--c-A:#cfe3fb;--c-p:#cdeed9;--c-m:#fde0b8;--c-g:#e6d6f7;--c-q:#fff0a6;
  --font-display:"Bangers","Impact","Arial Black",sans-serif;
  --font-body:"Comic Neue","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.5;
  background-image:radial-gradient(var(--paper-dot) 1.6px,transparent 1.8px);background-size:14px 14px;
  padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
a.back{color:var(--ink);font-weight:700;text-decoration:none;font-size:15px}
a.back:hover{text-decoration:underline}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;letter-spacing:2px;font-size:clamp(38px,8vw,62px);line-height:.95;margin:0;
  color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.purse{display:flex;align-items:center;gap:8px;background:var(--panel);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 14px;font-family:var(--font-display);font-size:30px;letter-spacing:1px;line-height:1.1}
.purse small{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.coin{display:inline-flex;align-items:center;justify-content:center;width:1.1em;height:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,var(--yellow) 55%,#e2a800);border:2.5px solid var(--ink);font-family:var(--font-display);font-size:.7em;line-height:1;vertical-align:-.15em;color:var(--ink)}
.coin.off{background:#ddd;border-style:dashed;color:#999}

.levels{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.lv{font-family:var(--font-display);font-size:20px;padding:4px 0 0;border:3px solid var(--ink);background:#e7e2cc;color:#8a8470;cursor:not-allowed;border-radius:8px;line-height:1.2;min-height:40px}
.lv.open{background:var(--panel);color:var(--ink);cursor:pointer}
.lv.done{background:#cdeed9;color:var(--ink);cursor:pointer}
.lv.cur{background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.lv:focus-visible,button:focus-visible,input:focus-visible{outline:3px dashed var(--blue);outline-offset:3px}
.lv .c{display:block;font-family:var(--font-body);font-size:11px;font-weight:700;line-height:1;padding-bottom:3px}
@media(max-width:560px){.levels{grid-template-columns:repeat(8,1fr)}}

.card{background:var(--panel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:1px;margin:0;line-height:1.05}
.card h2 small{font-family:var(--font-body);font-size:15px;color:var(--muted);letter-spacing:0;font-weight:700;display:block;margin-top:2px}
.text{font-size:20px;line-height:1.9}
.rule{background:#fff7d6;border:2px dashed #b9ad85;border-radius:10px;padding:8px 12px;font-size:16px;font-weight:700}

/* Markierungen im Text */
.mk{border-radius:5px;padding:1px 3px;position:relative;transition:background .25s}
.rv .mk,.hl .mk{padding:1px 4px}
.rv .mk-F,.hl .mk-F{background:var(--c-F)}.rv .mk-A,.hl .mk-A{background:var(--c-A)}.rv .mk-p,.hl .mk-p{background:var(--c-p)}
.rv .mk-m,.hl .mk-m{background:var(--c-m)}.rv .mk-g,.hl .mk-g{background:var(--c-g)}.rv .mk-q,.hl .mk-q{background:var(--c-q)}
.rv .mk::after{content:attr(data-t);display:inline-block;font-size:11px;font-weight:700;margin-left:4px;padding:0 5px;border-radius:6px;border:1.5px solid var(--ink);background:#fff;vertical-align:.5em;line-height:1.3}

.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.answer label{font-weight:700}
.field{display:flex;align-items:center;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.field input{font:inherit;font-size:22px;font-weight:700;border:0;padding:6px 10px;width:10ch;min-width:0;background:transparent;color:var(--ink)}
.field input:focus-visible{outline:none}
.field:focus-within{outline:3px dashed var(--blue);outline-offset:3px}
.field span{padding:6px 12px;background:var(--yellow);border-left:3px solid var(--ink);font-weight:700;font-size:20px}
.btn{font-family:var(--font-display);font-size:23px;letter-spacing:1px;border:3px solid var(--ink);border-radius:10px;padding:5px 16px 2px;cursor:pointer;background:var(--green);color:#fff;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.tip{background:var(--yellow);color:var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.status{display:flex;gap:16px;flex-wrap:wrap;font-weight:700;font-size:16px;color:var(--muted);align-items:center}
.status b{color:var(--ink)}

.fb{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}
.fb.good{background:#cdeed9}.fb.bad{background:#fde0dc}.fb.info{background:#fff0a6}
.fb:empty{display:none}

.tips{display:flex;flex-direction:column;gap:10px}
.tipbox{border:3px solid var(--ink);border-radius:12px;background:#fffbe6;padding:10px 14px}
.tipbox h4{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:21px;letter-spacing:1px}

/* Sortier-Aufgabe */
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.item{font:inherit;text-align:left;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:10px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;color:var(--ink);line-height:1.6}
.item:hover{background:#fffbe6}
.item .em{font-size:30px;line-height:1}
.item .nm{font-weight:700;font-size:19px}
.item.sel{background:#fff0a6;box-shadow:3px 3px 0 var(--ink)}
.item .no{position:absolute;top:-12px;right:-8px;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;border:3px solid var(--ink);font-family:var(--font-display);font-size:22px;display:flex;align-items:center;justify-content:center;padding-top:2px}
.items.locked .item{cursor:default}

/* Lösungsweg */
.sol{border:4px solid var(--ink);border-radius:14px;background:#f4faff;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sol h3{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;letter-spacing:1px}
.sol h4{margin:0 0 2px;font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:1px;color:var(--blue)}
.sol ul{margin:0;padding-left:22px}
.sol .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sol .calc{font-size:20px;font-weight:700}
.sol .ans{background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
.sol .sub{border-top:2px dashed #9bb7d6;padding-top:10px}
svg.tri text{font-family:var(--font-display);font-size:34px;text-anchor:middle}

.end{text-align:center}
.end .big{font-family:var(--font-display);font-size:44px;letter-spacing:1px;color:var(--red);line-height:1}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--muted);font-weight:700}
footer button{font:inherit;background:none;border:0;text-decoration:underline;cursor:pointer;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.btn,.mk{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Zur Übersicht</a>
  <header>
    <h1>Druck-Training</h1>
    <div class="purse" aria-live="polite"><span class="coin">€</span><span id="total">0</span><small>/ 45 Münzen</small></div>
  </header>
  <nav class="levels" id="levels" aria-label="Level"></nav>
  <main class="card" id="card"></main>
  <footer>
    <span>Rechne mit g = 10 N/kg. 1 m² = 10 000 cm².</span>
    <button id="reset" type="button">Fortschritt zurücksetzen</button>
  </footer>
</div>

<script>
/* ---------- Aufgaben ----------
   Markierungen im Text: {F|..} Kraft, {A|..} Fläche, {p|..} Druck, {m|..} Masse, {g|..} Ortsfaktor, {q|..} gesucht */
const G = '{g|g = 10 N/kg}';
const TASKS = [
 /* --- Level 1-5: Grundlagen --- */
 { title:'Druck berechnen', topic:'Gesucht: p', type:'num', ask:'p',
   text:'Ein Ziegelstein drückt mit einer Kraft von {F|60 N} auf einen Tisch. Die Auflagefläche beträgt {A|0,02 m²}. {q|Wie groß ist der Druck?}',
   given:['{F|F = 60 N}','{A|A = 0,02 m²}'], pre:[], preHint:'',
   calc:'p = 60 N : 0,02 m² = <b>3 000 Pa</b>', answer:3000,
   ans:'Der Ziegelstein übt einen Druck von 3 000 Pa auf den Tisch aus.' },
 { title:'Kraft berechnen', topic:'Gesucht: F', type:'num', ask:'F',
   text:'Eine Holzkiste übt auf dem Boden einen Druck von {p|500 Pa} aus. Ihre Standfläche ist {A|2 m²} groß. {q|Wie groß ist die Kraft, mit der die Kiste auf den Boden drückt?}',
   given:['{p|p = 500 Pa}','{A|A = 2 m²}'], pre:[], preHint:'',
   calc:'F = 500 Pa · 2 m² = <b>1 000 N</b>', answer:1000,
   ans:'Die Kiste drückt mit einer Kraft von 1 000 N auf den Boden.' },
 { title:'Fläche berechnen', topic:'Gesucht: A', type:'num', ask:'A',
   text:'Ein Betonklotz drückt mit {F|3 000 N} auf den Boden. Dabei entsteht ein Druck von {p|1 500 Pa}. {q|Wie groß ist die Auflagefläche?}',
   given:['{F|F = 3 000 N}','{p|p = 1 500 Pa}'], pre:[], preHint:'',
   calc:'A = 3 000 N : 1 500 Pa = <b>2 m²</b>', answer:2,
   ans:'Der Betonklotz hat eine Auflagefläche von 2 m².' },
 { title:'Der Fahrradreifen', topic:'Gesucht: F', type:'num', ask:'F',
   text:'Ein Fahrradreifen übt auf die Straße einen Druck von {p|200 000 Pa} aus. Die Fläche, mit der er die Straße berührt, ist nur {A|0,001 m²} groß. {q|Mit welcher Kraft drückt der Reifen auf die Straße?}',
   given:['{p|p = 200 000 Pa}','{A|A = 0,001 m²}'], pre:[], preHint:'',
   calc:'F = 200 000 Pa · 0,001 m² = <b>200 N</b>', answer:200,
   ans:'Der Reifen drückt mit 200 N auf die Straße.' },
 { title:'Schuhe sortieren', topic:'Sortieren', type:'sort', dir:'asc',
   text:'Drei Schuhe werden jeweils mit derselben Kraft von {F|120 N} belastet. {q|Sortiere sie nach dem Druck auf den Boden: vom kleinsten zum größten Druck.}',
   given:['{F|F = 120 N} (bei allen Schuhen gleich)'], preHint:'',
   items:[
    { em:'🥾', name:'Wanderstiefel', desc:'{A|A = 0,03 m²}', pre:[], calc:'p = 120 N : 0,03 m² = <b>4 000 Pa</b>', p:4000 },
    { em:'👠', name:'Stöckelschuh-Absatz', desc:'{A|A = 0,0004 m²}', pre:[], calc:'p = 120 N : 0,0004 m² = <b>300 000 Pa</b>', p:300000 },
    { em:'🎿', name:'Schneeschuh', desc:'{A|A = 0,2 m²}', pre:[], calc:'p = 120 N : 0,2 m² = <b>600 Pa</b>', p:600 } ],
   ans:'Bei gleicher Kraft gilt: Je kleiner die Fläche, desto größer der Druck. Deshalb sinkt man mit Schneeschuhen kaum ein, mit Absätzen aber tief.' },

 /* --- Level 6-10: Umrechnen --- */
 { title:'Das Buch', topic:'cm² umrechnen', type:'num', ask:'p',
   text:'Ein Buch drückt mit {F|12 N} auf einen Tisch. Seine Auflagefläche beträgt {A|600 cm²}. {q|Wie groß ist der Druck in Pa?}',
   given:['{F|F = 12 N}','{A|A = 600 cm²}'],
   pre:['Fläche umrechnen: 1 m² = 10 000 cm², also 600 cm² : 10 000 = <b>0,06 m²</b>'],
   preHint:'Rechne die Fläche zuerst von cm² in m² um (1 m² = 10 000 cm²).',
   calc:'p = 12 N : 0,06 m² = <b>200 Pa</b>', answer:200,
   ans:'Das Buch übt einen Druck von 200 Pa auf den Tisch aus.' },
 { title:'Das Tischbein', topic:'cm² umrechnen', type:'num', ask:'F',
   text:'Unter einem Tischbein herrscht ein Druck von {p|80 000 Pa}. Die Aufstandsfläche des Beins beträgt {A|25 cm²}. {q|Wie groß ist die Kraft auf das Tischbein?}',
   given:['{p|p = 80 000 Pa}','{A|A = 25 cm²}'],
   pre:['Fläche umrechnen: 25 cm² : 10 000 = <b>0,0025 m²</b>'],
   preHint:'Rechne die Fläche zuerst von cm² in m² um (1 m² = 10 000 cm²).',
   calc:'F = 80 000 Pa · 0,0025 m² = <b>200 N</b>', answer:200,
   ans:'Auf das Tischbein wirkt eine Kraft von 200 N.' },
 { title:'Reifen im Vergleich', topic:'Sortieren + umrechnen', type:'sort', dir:'desc',
   text:'Verschiedene Reifen drücken auf die Straße. {q|Sortiere sie nach dem Druck: vom größten zum kleinsten Druck.}',
   given:['Für jeden Reifen sind Kraft und Fläche gegeben.'],
   preHint:'Rechne die Flächen zuerst von cm² in m² um (1 m² = 10 000 cm²).',
   items:[
    { em:'🚲', name:'Fahrradreifen', desc:'{F|F = 240 N}, {A|A = 20 cm²}', pre:['20 cm² : 10 000 = <b>0,002 m²</b>'], calc:'p = 240 N : 0,002 m² = <b>120 000 Pa</b>', p:120000 },
    { em:'👟', name:'Turnschuh', desc:'{F|F = 300 N}, {A|A = 150 cm²}', pre:['150 cm² : 10 000 = <b>0,015 m²</b>'], calc:'p = 300 N : 0,015 m² = <b>20 000 Pa</b>', p:20000 },
    { em:'🚗', name:'Autoreifen', desc:'{F|F = 4 000 N}, {A|A = 200 cm²}', pre:['200 cm² : 10 000 = <b>0,02 m²</b>'], calc:'p = 4 000 N : 0,02 m² = <b>200 000 Pa</b>', p:200000 } ],
   ans:'Der große Druck beim Autoreifen entsteht, weil die Kraft sehr groß ist, die Fläche aber nur vergleichsweise klein.' },
 { title:'Der Stuhl', topic:'Mehrere Flächen', type:'num', ask:'p',
   text:'Ein Stuhl hat vier Beine. Jedes Bein hat eine Aufstandsfläche von {A|5 cm²}. Der Stuhl drückt zusammen mit dem Kind, das darauf sitzt, mit {F|400 N} auf den Boden. {q|Wie groß ist der Druck?}',
   given:['{F|F = 400 N}','{A|A<sub>1 Bein</sub> = 5 cm²} (4 Beine)'],
   pre:['Gesamtfläche: 4 · 5 cm² = 20 cm²','Umrechnen: 20 cm² : 10 000 = <b>0,002 m²</b>'],
   preHint:'Alle vier Beine zusammen ergeben die Fläche. Dann in m² umrechnen.',
   calc:'p = 400 N : 0,002 m² = <b>200 000 Pa</b>', answer:200000,
   ans:'Unter den Stuhlbeinen herrscht ein Druck von 200 000 Pa.' },
 { title:'Die Bodenplatte', topic:'Gesucht: A', type:'num', ask:'A',
   text:'Eine Bodenplatte hält höchstens einen Druck von {p|4 000 Pa} aus. Darauf soll eine Maschine gestellt werden, die mit {F|1 200 N} drückt. {q|Wie groß muss die Auflagefläche der Maschine mindestens sein?}',
   given:['{p|p = 4 000 Pa} (höchstens)','{F|F = 1 200 N}'], pre:[], preHint:'',
   calc:'A = 1 200 N : 4 000 Pa = <b>0,3 m²</b>', answer:0.3,
   ans:'Die Maschine braucht mindestens 0,3 m² Auflagefläche, sonst wird der Druck zu groß.' },

 /* --- Level 11-15: Mit Gewichtskraft --- */
 { title:'Der Kasten', topic:'Masse → Kraft', type:'num', ask:'p',
   text:'Ein Kasten hat eine Masse von {m|30 kg} und steht auf einer Fläche von {A|0,5 m²}. Rechne mit '+G+'. {q|Wie groß ist der Druck auf den Boden?}',
   given:['{m|m = 30 kg}','{A|A = 0,5 m²}',G],
   pre:['Die Kraft ist hier nicht gegeben, aber die Gewichtskraft des Kastens drückt auf den Boden: F = m · g = 30 kg · 10 N/kg = <b>300 N</b>'],
   preHint:'Berechne aus der Masse zuerst die Gewichtskraft: F = m · g.',
   calc:'p = 300 N : 0,5 m² = <b>600 Pa</b>', answer:600,
   ans:'Der Kasten übt einen Druck von 600 Pa auf den Boden aus.' },
 { title:'Das Mädchen', topic:'Masse + 2 Flächen', type:'num', ask:'p',
   text:'Ein Mädchen mit einer Masse von {m|40 kg} steht auf beiden Füßen. Jede Schuhsohle hat eine Fläche von {A|200 cm²}. Rechne mit '+G+'. {q|Welchen Druck übt das Mädchen auf den Boden aus?}',
   given:['{m|m = 40 kg}','{A|A<sub>1 Schuh</sub> = 200 cm²} (2 Schuhe)',G],
   pre:['Gewichtskraft: F = 40 kg · 10 N/kg = <b>400 N</b>','Gesamtfläche: 2 · 200 cm² = 400 cm²','Umrechnen: 400 cm² : 10 000 = <b>0,04 m²</b>'],
   preHint:'Gewichtskraft aus der Masse berechnen, beide Schuhe zusammenzählen, dann cm² in m² umrechnen.',
   calc:'p = 400 N : 0,04 m² = <b>10 000 Pa</b>', answer:10000,
   ans:'Das Mädchen übt einen Druck von 10 000 Pa auf den Boden aus.' },
 { title:'Tiere und Mensch', topic:'Sortieren (schwer)', type:'sort', dir:'desc',
   text:'Wer drückt am stärksten auf den Boden? Rechne mit '+G+'. {q|Sortiere vom größten zum kleinsten Druck.}',
   given:[G+' (für alle)'],
   preHint:'Aus der Masse die Gewichtskraft berechnen, alle Füße zusammenzählen, dann cm² in m² umrechnen.',
   items:[
    { em:'🧍', name:'Mensch', desc:'{m|m = 60 kg}, 2 Füße mit je {A|100 cm²}',
      pre:['F = 60 kg · 10 N/kg = <b>600 N</b>','A = 2 · 100 cm² = 200 cm² = <b>0,02 m²</b>'], calc:'p = 600 N : 0,02 m² = <b>30 000 Pa</b>', p:30000 },
    { em:'🐘', name:'Elefant', desc:'{m|m = 3 000 kg}, 4 Füße mit je {A|0,15 m²}',
      pre:['F = 3 000 kg · 10 N/kg = <b>30 000 N</b>','A = 4 · 0,15 m² = <b>0,6 m²</b>'], calc:'p = 30 000 N : 0,6 m² = <b>50 000 Pa</b>', p:50000 },
    { em:'🐱', name:'Katze', desc:'{m|m = 4 kg}, 4 Pfoten mit je {A|1 cm²}',
      pre:['F = 4 kg · 10 N/kg = <b>40 N</b>','A = 4 · 1 cm² = 4 cm² = <b>0,0004 m²</b>'], calc:'p = 40 N : 0,0004 m² = <b>100 000 Pa</b>', p:100000 } ],
   ans:'Überraschung: Die kleine Katze drückt am stärksten! Entscheidend ist nicht nur die Kraft, sondern wie klein die Fläche ist, auf die sie wirkt.' },
 { title:'Das Auto', topic:'Masse + 4 Reifen', type:'num', ask:'p',
   text:'Ein Auto hat eine Masse von {m|1 200 kg}. Jeder der vier Reifen berührt die Straße auf einer Fläche von {A|150 cm²}. Rechne mit '+G+'. {q|Welchen Druck übt das Auto auf die Straße aus?}',
   given:['{m|m = 1 200 kg}','{A|A<sub>1 Reifen</sub> = 150 cm²} (4 Reifen)',G],
   pre:['Gewichtskraft: F = 1 200 kg · 10 N/kg = <b>12 000 N</b>','Gesamtfläche: 4 · 150 cm² = 600 cm²','Umrechnen: 600 cm² : 10 000 = <b>0,06 m²</b>'],
   preHint:'Gewichtskraft aus der Masse berechnen, vier Reifen zusammenzählen, dann cm² in m² umrechnen.',
   calc:'p = 12 000 N : 0,06 m² = <b>200 000 Pa</b>', answer:200000,
   ans:'Das Auto übt einen Druck von 200 000 Pa auf die Straße aus.' },
 { title:'Auf dünnem Eis', topic:'Endgegner', type:'num', ask:'A',
   text:'Ein Lastwagen hat mit Ladung eine Masse von {m|6 000 kg}. Er soll über eine Eisfläche fahren, die höchstens einen Druck von {p|100 000 Pa} aushält. Rechne mit '+G+'. {q|Wie groß muss die Fläche aller Reifen zusammen mindestens sein?}',
   given:['{m|m = 6 000 kg}','{p|p = 100 000 Pa} (höchstens)',G],
   pre:['Gewichtskraft: F = 6 000 kg · 10 N/kg = <b>60 000 N</b>'],
   preHint:'Aus der Masse zuerst die Gewichtskraft berechnen. Dann ist die Fläche gesucht.',
   calc:'A = 60 000 N : 100 000 Pa = <b>0,6 m²</b>', answer:0.6,
   ans:'Alle Reifen zusammen brauchen mindestens 0,6 m² Auflagefläche, damit das Eis hält.' }
];

/* ---------- Hilfsfunktionen ---------- */
const TAGS = {F:'Kraft F',A:'Fläche A',p:'Druck p',m:'Masse m',g:'Ortsfaktor g',q:'gesucht'};
const mk = s => s.replace(/\{(\w)\|([^}]*)\}/g,(_,k,t)=>`<span class="mk mk-${k}" data-t="${TAGS[k]}">${t}</span>`);
const $ = id => document.getElementById(id);
const coin = (off) => `<span class="coin${off?' off':''}">€</span>`;
const coins = n => Array.from({length:3},(_,i)=>coin(i>=n)).join('');
const UNIT = {p:'Pa',F:'N',A:'m²'};
const NAME = {p:'Druck p',F:'Kraft F',A:'Fläche A'};
const FORMULA = {p:'p = F : A',F:'F = p · A',A:'A = F : p'};

function parseNum(s){
  s=s.trim().replace(/\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN;
}
function triangle(ask){
  const hi = k => k===ask;
  const t = (k,x,y)=> hi(k)
    ? `<circle cx="${x}" cy="${y-11}" r="19" fill="#ffd23f" stroke="#1b1b1f" stroke-width="3"/><text x="${x}" y="${y}" fill="#e63b2e">?</text>`
    : `<text x="${x}" y="${y}" fill="#1b1b1f">${k}</text>`;
  return `<svg class="tri" width="170" height="125" viewBox="0 0 200 140" role="img" aria-label="Rechendreieck: F oben, p unten links, A unten rechts. Gesucht ist ${ask}.">
    <polygon points="100,6 8,130 192,130" fill="#fff7d6" stroke="#1b1b1f" stroke-width="4" stroke-linejoin="round"/>
    <line x1="42" y1="82" x2="158" y2="82" stroke="#1b1b1f" stroke-width="4"/>
    <line x1="100" y1="82" x2="100" y2="130" stroke="#1b1b1f" stroke-width="4"/>
    ${t('F',100,66)}${t('p',66,118)}${t('A',134,118)}</svg>`;
}
function triBlock(ask){
  return `<div class="row">${triangle(ask)}<div><div>Verdecke die gesuchte Größe <b>${ask}</b> im Rechendreieck:</div>
  <div class="calc">${FORMULA[ask]}</div><div style="font-size:15px">(oben : unten = Bruch, nebeneinander = Mal)</div></div></div>`;
}
const list = a => `<ul>${a.map(x=>`<li>${mk(x)}</li>`).join('')}</ul>`;

/* ---------- Zustand ---------- */
const KEY='druck-training-v1';
let prog = {coins:Array(TASKS.length).fill(null)};
try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&Array.isArray(s.coins)&&s.coins.length===TASKS.length) prog=s; }catch(e){}
const save=()=>{ try{localStorage.setItem(KEY,JSON.stringify(prog));}catch(e){} };
let cur = Math.max(0, prog.coins.findIndex(c=>c===null)); if(prog.coins.every(c=>c!==null)) cur=0;
let st;
const order = t => t.items.map((_,i)=>i).sort((a,b)=>t.dir==='asc'?t.items[a].p-t.items[b].p:t.items[b].p-t.items[a].p);
const newState = () => ({attempts:0,tips:0,done:false,failed:false,msg:'',msgCls:'',seq:[],val:'',viewOnly:false});
function unlocked(i){ return i===0 || prog.coins[i-1]!==null; }
function total(){ return prog.coins.reduce((a,c)=>a+(c||0),0); }

/* ---------- Lösungs-/Tipp-Bausteine ---------- */
function given(t){ return `<div><h4>Gegeben</h4>${list(t.given)}</div>`; }
function sought(t){
  return t.type==='num'
   ? `<div><h4>Gesucht</h4>${mk(`{q|${NAME[t.ask]} in ${UNIT[t.ask]}}`)}</div>`
   : `<div><h4>Gesucht</h4>${mk('{q|Druck p}')} von jedem Objekt, danach sortieren</div>`;
}
function tip1(t){ return `<div class="tipbox hl"><h4>Tipp 1: Gegeben und gesucht</h4>${given(t)}${sought(t)}<div style="font-size:15px;margin-top:4px">Im Aufgabentext sind die Angaben jetzt farbig markiert.</div></div>`; }
function tip2(t){
  const ask = t.type==='num'?t.ask:'p';
  return `<div class="tipbox"><h4>Tipp 2: Das Rechendreieck</h4>${triBlock(ask)}${t.preHint?`<div class="rule" style="margin-top:8px">⚠ ${t.preHint}</div>`:''}</div>`;
}
function tip3(t){
  if(t.type==='num') return `<div class="tipbox hl"><h4>Tipp 3: Die Rechnung</h4>${t.pre.length?list(t.pre):''}<div class="calc">${mk(t.calc)}</div><div style="margin-top:6px">Tippe das Ergebnis ein, um die Aufgabe abzuschließen.</div></div>`;
  const o=order(t);
  return `<div class="tipbox hl"><h4>Tipp 3: Alle Drücke</h4>${list(t.items.map(it=>`${it.em} <b>${it.name}</b>: ${it.calc.replace(/^p = .* = /,'p = ')}`))}<div>Jetzt nur noch richtig ${t.dir==='asc'?'aufsteigend':'absteigend'} sortieren.</div></div>`;
}
function solution(t){
  let h=`<div class="sol hl"><h3>Lösungsweg</h3>`;
  if(t.type==='num'){
    h+=given(t)+sought(t);
    if(t.pre.length) h+=`<div><h4>Umrechnen / Zwischenschritt</h4>${list(t.pre)}</div>`;
    h+=`<div><h4>Rechendreieck</h4>${triBlock(t.ask)}</div>`;
    h+=`<div><h4>Einsetzen und rechnen</h4><div class="calc">${mk(t.calc)}</div></div>`;
    h+=`<div class="ans">Antwort: ${t.ans}</div>`;
  }else{
    h+=given(t)+`<div><h4>Gesucht</h4>${mk('{q|Druck p}')} jedes Objekts, danach sortieren</div>`;
    h+=`<div><h4>Rechendreieck</h4>${triBlock('p')}${t.preHint?`<div class="rule">⚠ ${t.preHint}</div>`:''}</div>`;
    t.items.forEach(it=>{
      h+=`<div class="sub"><h4>${it.em} ${it.name}</h4><div>Gegeben: ${mk(it.desc)}</div>${it.pre.length?list(it.pre):''}<div class="calc">${mk(it.calc)}</div></div>`;
    });
    const o=order(t);
    h+=`<div class="ans">Reihenfolge (${t.dir==='asc'?'kleinster → größter':'größter → kleinster'} Druck): ${o.map(i=>t.items[i].em+' '+t.items[i].name).join(' → ')}<br>${t.ans}</div>`;
  }
  return h+'</div>';
}

/* ---------- Rendern ---------- */
function renderLevels(){
  $('levels').innerHTML = TASKS.map((t,i)=>{
    const done=prog.coins[i]!==null, open=unlocked(i);
    const cls = i===cur?'cur':done?'done':open?'open':'';
    return `<button class="lv ${cls}" data-i="${i}" ${open?'':'disabled'} aria-label="Level ${i+1}${done?', '+prog.coins[i]+' Münzen':open?'':', gesperrt'}" ${i===cur?'aria-current="true"':''}>${open?i+1:'🔒'}<span class="c">${done?prog.coins[i]+' €':'&nbsp;'}</span></button>`;
  }).join('');
  $('total').textContent = total();
}
function potential(){ return Math.max(0,(st.attempts===0?3:2)-st.tips); }

function render(keepFocus){
  renderLevels();
  if(cur>=TASKS.length){ return renderEnd(); }
  const t=TASKS[cur], solved=st.done;
  const rv = st.tips>=1 || solved;
  let h=`<h2>Level ${cur+1}: ${t.title}<small>${t.topic}</small></h2>`;
  h+=`<div class="text ${rv?'rv':''}">${mk(t.text)}</div>`;
  if(t.type==='sort'){
    const lock=solved;
    h+=`<div class="items ${lock?'locked':''} ${rv?'rv':''}" role="group" aria-label="Objekte, in Reihenfolge antippen">`+
      t.items.map((it,i)=>{ const n=st.seq.indexOf(i);
        return `<button type="button" class="item ${n>=0?'sel':''}" data-it="${i}" ${lock?'disabled':''} aria-pressed="${n>=0}"><span class="em">${it.em}</span><span class="nm">${it.name}</span><span>${mk(it.desc)}</span>${n>=0?`<span class="no">${n+1}</span>`:''}</button>`;}).join('')+`</div>`;
    if(!solved) h+=`<div class="rule">Tippe die Objekte in der richtigen Reihenfolge an (${t.dir==='asc'?'kleinster':'größter'} Druck zuerst). Nochmal tippen nimmt ein Objekt zurück.</div>`;
  }
  if(!solved){
    h+=`<div class="status"><span>Versuch <b>${st.attempts+1}</b> von 2</span><span>Tipps genutzt: <b>${st.tips}</b> von 3</span><span>Mögliche Münzen jetzt: ${coins(potential())}</span></div>`;
    h+=`<div class="actions">`;
    if(t.type==='num') h+=`<label class="answer" for="inp"><span class="sr" style="position:absolute;left:-9999px">Antwort</span></label><div class="field"><input id="inp" inputmode="decimal" autocomplete="off" placeholder="Ergebnis" value="${st.val}" aria-label="Deine Antwort in ${UNIT[t.ask]}"><span>${UNIT[t.ask]}</span></div>`;
    h+=`<button class="btn" id="check" type="button" ${t.type==='sort'&&st.seq.length<t.items.length?'disabled':''}>Prüfen</button>`;
    h+=st.tips<3?`<button class="btn tip" id="tip" type="button">Tipp ${st.tips+1} (−1 ${coin()})</button>`:'';
    h+=`</div>`;
  }
  h+=`<div class="fb ${st.msgCls}" role="status" aria-live="polite">${st.msg}</div>`;
  const tips=[tip1,tip2,tip3].slice(0,st.tips).map(f=>f(t)).join('');
  if(tips && !solved) h+=`<div class="tips">${tips}</div>`;
  if(solved){
    if(!st.viewOnly) h+=`<div class="status">Verdient: ${coins(prog.coins[cur])} <b>${prog.coins[cur]} von 3</b></div>`;
    h+=solution(t);
    h+=`<div class="actions"><button class="btn" id="next" type="button">${cur===TASKS.length-1?'Zum Ergebnis':'Nächstes Level'} →</button></div>`;
  }
  $('card').innerHTML=h;
  if(keepFocus){ const i=$('inp'); if(i){ i.focus(); const v=i.value; i.value=''; i.value=v; } }
}
function renderEnd(){
  const n=total();
  const rank = n>=40?'Druck-Profi':n>=28?'Druck-Experte':n>=15?'Druck-Lehrling':'Druck-Anfänger';
  $('card').innerHTML=`<div class="end"><div class="big">Geschafft!</div><p>Du hast alle 15 Level gespielt.</p><div style="font-size:34px">${n} von 45 Münzen</div><p>Dein Titel: <b>${rank}</b></p><p>Du kannst jedes Level anklicken und den Lösungsweg nachlesen. Mit „Fortschritt zurücksetzen" unten startest du neu.</p></div>`;
}

/* ---------- Logik ---------- */
function finish(coinsEarned, failed){
  st.done=true; st.failed=failed; prog.coins[cur]=coinsEarned; save();
  const left = (st.tips>0 && coinsEarned===0 && !failed)? ' Mit so vielen Tipps gibt es keine Münzen mehr.':'';
  if(failed){ st.msg='Leider wieder nicht richtig. Schau dir den Lösungsweg genau an, damit du es beim nächsten Mal schaffst.'; st.msgCls='bad'; }
  else { st.msg=(st.attempts===0?'Richtig! ':'Jetzt stimmt es! ')+(coinsEarned>0?`Du bekommst ${coinsEarned} ${coinsEarned===1?'Münze':'Münzen'}.`:'Richtig, aber diesmal gibt es keine Münzen.')+left; st.msgCls='good'; }
}
function checkAnswer(ok){
  if(st.done) return;
  const base = st.attempts===0?3:2;
  if(ok){ finish(Math.max(0,base-st.tips),false); }
  else{
    st.attempts++;
    if(st.attempts>=2) finish(0,true);
    else { st.msg='Nicht ganz richtig. Du hast noch einen zweiten Versuch (dann gibt es höchstens 2 Münzen).'; st.msgCls='bad'; if(TASKS[cur].type==='sort') st.seq=[]; }
  }
  render();
}
function select(i){ cur=i; st=newState(); if(prog.coins[i]!==null){ st.done=true; st.viewOnly=true; st.msg=''; } render(); window.scrollTo({top:0,behavior:'smooth'}); }

document.addEventListener('click',e=>{
  const lv=e.target.closest('.lv'); if(lv&&!lv.disabled){ select(+lv.dataset.i); return; }
  const it=e.target.closest('.item'); if(it&&!st.done){
    const i=+it.dataset.it, p=st.seq.indexOf(i); if(p>=0) st.seq.splice(p,1); else st.seq.push(i);
    st.msg=''; st.msgCls=''; render(); const b=document.querySelector(`.item[data-it="${i}"]`); if(b)b.focus(); return; }
  const id=e.target.id;
  if(id==='check'){
    const t=TASKS[cur];
    if(t.type==='num'){
      const v=parseNum($('inp').value); st.val=$('inp').value;
      if(isNaN(v)){ st.msg='Bitte gib eine Zahl ein, zum Beispiel 2500 oder 0,5.'; st.msgCls='info'; render(true); return; }
      checkAnswer(Math.abs(v-t.answer)<=Math.abs(t.answer)*1e-6);
    } else checkAnswer(order(t).every((x,k)=>st.seq[k]===x));
  }
  else if(id==='tip'){
    if(st.tips<3){ const t=TASKS[cur]; if(t.type==='num') st.val=($('inp')||{}).value||''; st.tips++; st.msg=st.tips===3?'Mit Tipp 3 ist die Lösung verraten, dafür gibt es für diese Aufgabe keine Münzen mehr.':`Tipp ${st.tips} geholt: 1 Münze weniger möglich.`; st.msgCls='info'; render(); }
  }
  else if(id==='next'){ if(cur<TASKS.length-1){ const n=prog.coins.findIndex((c,i)=>i>cur&&c===null); select(n>=0?n:cur+1);} else { cur=TASKS.length; render(); } }
  else if(id==='reset'){ if(confirm('Wirklich den ganzen Fortschritt löschen?')){ prog={coins:Array(TASKS.length).fill(null)}; save(); select(0); } }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='inp'){ e.preventDefault(); $('check').click(); } });

select(cur);
</script>
</body>
</html>
